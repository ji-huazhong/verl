# Fast GRPO integration/numerical smoke test; keep the 64-GPU parallel layout.
# The short response cap and small cohort are not an accuracy benchmark.
defaults:
  - qwen3_8_next_dapo17k
  - _self_

data:
  train_batch_size: 8
  max_response_length: 2048

actor_rollout_ref:
  actor:
    ppo_mini_batch_size: 8
    ppo_max_token_len_per_gpu: 4096
  ref:
    log_prob_max_token_len_per_gpu: 4096
  rollout:
    n: 2
    max_model_len: 4096
    log_prob_max_token_len_per_gpu: 4096

trainer:
  experiment_name: grpo_dapo17k_debug_8x2_2k
  total_training_steps: 1
  val_before_train: false
  test_freq: -1
  save_freq: -1
  resume_mode: disable
